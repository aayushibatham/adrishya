[project]
name = "adrishya"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aayushi", email = "aayushitsec@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cvzone>=2.0.0",
    "lap>=0.5.13",
    "opencv-python>=5.0.0.93",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.123",
]

[project.scripts]
adrishya = "adrishya:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
